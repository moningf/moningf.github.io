#########################################
######### 中文语言的配置信息 ############
#########################################
disabled = false # 是否禁用此语言
languageCode = "zh-CN" # Hugo 语言代码
languageName = "简体中文" # 语言名称（显示在语言切换器中）
title = "Moningf's Blog" # 网站标题
weight = 1 # 语言排序权重（越小越靠前）

[params]
  displayName = "简体中文" # 在语言切换菜单中显示的名称
  isoCode = "zh-CN" # HTML 标签中的语言代码 (例如 <html lang="zh-CN">)
  rtl = false   # 是否为从右向左阅读的语言 (如阿拉伯语)
  dateFormat = "02 Jan 2006" # 日期显示格式
  logo = "favicon/favicon-32x32.png" # 网站 Logo (在 assets/ 目录下)
  secondaryLogo = "favicon/favicon-32x32.png" # 暗色模式下的 Logo
  # description = "My awesome website" # 网站描述 (SEO)
  # copyright = "Copy, _right?_ :thinking_face:" # 页脚版权信息

#########################################
############# 作者简介 ##################
#########################################
[params.author]
  name = "Moningf" # 作者名称
  email = "themoningf@gmail.com" # 作者邮箱 (用于 Gravatar 或 Email 链接)
  image = "img/author.jpg" # 作者头像 (在 assets/ 目录下)
  imageQuality = 96 # 头像图片质量 (1-100)
  headline = "You Only Live Once" # 作者简介标题 (显示在首页 Profile 布局)
  bio = "You Only Live Once" # 作者详细简介 (显示在文章页脚)
  links = [
    { github = "https://github.com/moningf" },
    { email = "mailto:themoningf@gmail.com" },
    # { bilibili = "https://space.bilibili.com/3546699316332613?spm_id_from=333.1007.0.0"},
    { zhihu = "https://www.zhihu.com/people/47-5-5-84"},
  ]
