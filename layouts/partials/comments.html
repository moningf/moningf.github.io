<!-- CSS -->
<link href="{{ $.Site.Params.artalk.server }}/dist/Artalk.css" rel="stylesheet">

<style>
  /* 亮色模式 - 适配 Blowfish */
  html .artalk, html .atk-layer-wrap {
    --at-color-main: rgb(59, 130, 246);
    --at-color-font: rgb(15, 23, 42);
    --at-color-deep: rgb(30, 41, 59);
    --at-color-sub: rgb(71, 85, 105);
    --at-color-meta: rgb(100, 116, 139);
    --at-color-grey: rgb(148, 163, 184);
    --at-color-border: rgb(203, 213, 225);
    --at-color-bg: rgb(255, 255, 255);
    --at-color-bg-transl: rgba(255, 255, 255, 0.95);
    --at-color-bg-grey: rgb(241, 245, 249);
    --at-color-bg-light: rgb(239, 246, 255);
  }

  /* 暗色模式 - 适配 Blowfish */
  html.dark .artalk, html.dark .atk-layer-wrap {
    --at-color-main: rgb(96, 165, 250);
    --at-color-font: rgb(226, 232, 240);
    --at-color-deep: rgb(248, 250, 252);
    --at-color-sub: rgb(203, 213, 225);
    --at-color-meta: rgb(148, 163, 184);
    --at-color-grey: rgb(100, 116, 139);
    --at-color-border: rgb(51, 65, 85);
    --at-color-bg: rgb(15, 23, 42);
    --at-color-bg-transl: rgba(15, 23, 42, 0.95);
    --at-color-bg-grey: rgb(30, 41, 59);
    --at-color-bg-light: rgb(30, 41, 59);
  }
</style>

<!-- JS -->
<script src="{{ $.Site.Params.artalk.server }}/dist/Artalk.js"></script>

<!-- Artalk -->
<div id="Comments"></div>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    var isDark = document.documentElement.classList.contains('dark');

    var artalk = Artalk.init({
      el:        '#Comments',
      pageKey:   '{{ .Permalink }}',
      pageTitle: '{{ .Title }}',
      server:    '{{ $.Site.Params.artalk.server }}',
      site:      '{{ $.Site.Params.artalk.site }}',
      darkMode:  isDark,
    });

    // 监听 Blowfish 主题切换
    var observer = new MutationObserver(function(mutations) {
      mutations.forEach(function(mutation) {
        if (mutation.type === 'attributes' && mutation.attributeName === 'class') {
          var nowDark = document.documentElement.classList.contains('dark');
          artalk.setDarkMode(nowDark);
        }
      });
    });

    observer.observe(document.documentElement, {
      attributes: true,
      attributeFilter: ['class']
    });
  });
</script>
