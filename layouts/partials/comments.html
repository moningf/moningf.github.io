<link rel="stylesheet" href="https://unpkg.com/@waline/client@v2/dist/waline.css" />

<div id="waline"></div>

<script type="module">
  import {init} from 'https://unpkg.com/@waline/client@v2/dist/waline.mjs';

  init({
    el: '#waline',
    serverURL: 'https://comment.moningf.top',
    dark: 'html.dark',  // 适配暗色模式
    pageview: true,     // 开启阅读量
    comment: true,      // 开启评论数

    // 只保留昵称和邮箱
    meta: ['nick', 'mail'],

    // 必填项 (如果你想让邮箱选填，就把 'mail' 从这里删掉)
    requiredMeta: ['nick'],

    // 表情包 (B站 + 贴吧 + 微博)
    emoji: [
      '//unpkg.com/@waline/emojis@1.1.0/bilibili',
      '//unpkg.com/@waline/emojis@1.1.0/tieba',
      '//unpkg.com/@waline/emojis@1.1.0/weibo',
    ],

    locale: {
      placeholder: '欢迎评论！',
      admin: '博主',
      sofa: '快来抢沙发~',
    },
  });
</script>

    --waline-bgcolor-light: #252538;
    --waline-border-color: #3f3f5a;
    --waline-info-bgcolor: #252538;
    --waline-info-color: #9ca3af;
  }

  #waline {
    margin-top: 3rem;
    padding-top: 2rem;
    border-top: 1px dashed var(--waline-border-color);

  }

  .wl-editor:focus,
