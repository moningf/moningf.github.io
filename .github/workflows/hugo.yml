name: Deploy Everywhere (HK Server + GitHub Pages)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# 设置权限，GitHub Pages 部署需要这些权限
permissions:
  contents: read
  pages: write
  id-token: write

# 防止并发冲突：如果上一次还没发完，这一次又来了，这就取消上一次
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # === 核心任务：构建 + 推送服务器 + 准备 Pages ===
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0 # 保证 Hugo 的 .GitInfo (最后修改时间) 功能正常

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true # Blowfish 必须用 extended

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        run: hugo --minify

      # --- 🌍 第一站：推送到服务器 ---
      - name: Deploy to Server (Rsync)
        run: |
          # 1. 配置 SSH
          mkdir -p ~/.ssh/
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts
          
          # 2. 同步文件
          # 注意：这里同步的是 public/ 目录
          rsync -avz --delete public/ ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}:/var/www/blog/

      # --- 📦 准备 GitHub Pages 的包裹 ---
      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # === 第二站：发布到 GitHub Pages ===
  deploy-pages:
    needs: build # 必须等上面的 build 任务成功了才执行
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
